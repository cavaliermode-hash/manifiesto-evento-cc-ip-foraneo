<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Horarios de pick up · Regreso 16 oct</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
:root{color-scheme:light;--green:#126B30;--green-dark:#0C4F23;--green-soft:#E6F2EA;--green-line:#B9D9C3;--ink:#16301F;--muted:#55705E;--line:#D3E4D8;
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;--body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;--mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace}
*{box-sizing:border-box}
body{margin:0;background:#fff;color:var(--ink);font:16px/1.45 var(--body)}
.wrap{max-width:860px;margin:0 auto;padding-inline:16px}
header{padding-block:14px 12px;border-bottom:4px solid var(--green)}
.logo{display:block;width:min(300px,50vw);height:auto;margin-bottom:10px}
.eyebrow{font:600 12px/1 var(--body);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
h1{color:var(--green);font:700 clamp(24px,5vw,36px)/1 var(--display);letter-spacing:.01em;margin:6px 0 4px;text-transform:uppercase;text-wrap:balance}
.sub{color:var(--muted);margin:0;font-size:14px}
main{padding-block:16px 40px}
.note{background:var(--green-soft);border:1px solid var(--green-line);border-radius:10px;padding:10px 14px;margin:0 0 16px;font-size:15px}
.card{border:1px solid var(--line);border-left:5px solid var(--green);border-radius:10px;margin-bottom:12px;overflow:hidden}
.top{display:flex;flex-wrap:wrap;align-items:center;gap:8px 20px;padding:12px 14px}
.pk{min-width:120px}
.pk small,.fl small{display:block;font:600 11px/1 var(--body);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
.pk b{font:700 34px/1 var(--mono);color:var(--green)}
.fl{flex:1;min-width:200px}
.fl b{font:700 22px/1.1 var(--display);letter-spacing:.03em}
.fl span{display:block;font-size:15px;margin-top:2px}
.fl span em{font-style:normal;font-family:var(--mono);font-weight:700}
.cnt{font:600 13px/1 var(--body);background:var(--green-soft);color:var(--green-dark);border-radius:999px;padding:6px 10px;white-space:nowrap}
ul{list-style:none;margin:0;padding:8px 14px 12px;border-top:1px solid var(--line);columns:2 260px;column-gap:24px}
li{padding:3px 0;font-size:14.5px;break-inside:avoid}
.back{display:inline-block;margin-top:8px;color:var(--green);font-weight:600}
#msg{color:var(--muted)}
@media print{.back{display:none}.card{break-inside:avoid}}
</style>
</head>
<body>
<header><div class="wrap">
  <img class="logo" src="logo-eci.png" alt="Viajes El Corte Inglés" width="900" height="126">
  <div class="eyebrow">Evento CC IP Foráneo · Regreso viernes 16 de octubre</div>
  <h1>Horarios de pick up</h1>
  <p class="sub" id="upd"></p>
</div></header>
<main class="wrap">
  <p class="note">El pick up es <b>3 horas antes</b> de la salida de cada vuelo de regreso. Horarios en hora local.</p>
  <div id="out"><p id="msg">Cargando…</p></div>
  <a class="back" href="./">‹ Volver al buscador</a>
</main>
<script>
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pad = n => String(n).padStart(2,'0');
const DIA = '2026-10-16', HORAS = 3;
function menos(hhmm, h){ const [H,M] = hhmm.split(':').map(Number); const t = ((H*60+M-h*60)%1440+1440)%1440; return pad(Math.floor(t/60))+':'+pad(t%60); }
fetch('data.json?v='+Date.now()).then(r=>r.json()).then(j=>{
  const g = {};
  j.filas.forEach(r => { const l = r.reg; if(!l || l.f !== DIA || !/^\d{1,2}:\d{2}$/.test(l.s||'')) return;
    const k = l.s.padStart(5,'0')+'|'+l.v; (g[k] = g[k] || {l, n:[]}).n.push(r.n); });
  const keys = Object.keys(g).sort();
  document.getElementById('upd').textContent = 'Actualizado: ' + j.actualizado;
  document.getElementById('out').innerHTML = keys.length ? keys.map(k => { const {l,n} = g[k]; n.sort((a,b)=>a.localeCompare(b,'es'));
    return `<section class="card"><div class="top">
      <div class="pk"><small>Pick up</small><b>${menos(l.s,HORAS)}</b></div>
      <div class="fl"><small>Vuelo</small><b>${esc(l.v)}</b><span>${esc(l.o)} <em>${esc(l.s)}</em> → ${esc(l.d)} <em>${esc(l.l)}</em></span></div>
      <span class="cnt">${n.length} ${n.length===1?'pasajero':'pasajeros'}</span></div>
      <ul>${n.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></section>`; }).join('')
    : '<p id="msg">No hay vuelos de regreso el 16 de octubre.</p>';
}).catch(()=>{ document.getElementById('msg').textContent = 'No se pudo cargar la información. Intenta de nuevo.'; });
</script>
</body>
</html>
