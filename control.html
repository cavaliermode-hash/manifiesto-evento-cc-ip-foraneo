<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Control de llegadas · Evento CC IP Foráneo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
:root{color-scheme:light;--green:#126B30;--green-dark:#0C4F23;--green-soft:#E6F2EA;--green-line:#B9D9C3;--ink:#16301F;--muted:#55705E;--line:#D3E4D8;
  --red:#B3261E;--red-soft:#FBE9E7;--amber:#8A5A00;--amber-soft:#FFF4D6;
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;--body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;--mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:#fff;color:var(--ink);font:15px/1.45 var(--body)}
.wrap{max-width:860px;margin:0 auto;padding-inline:16px}
header{padding-block:14px 12px;border-bottom:4px solid var(--green)}
.logo{display:block;width:min(260px,55vw);height:auto;margin-bottom:10px}
.eyebrow{font:600 12px/1 var(--body);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
h1{color:var(--green);font:700 clamp(24px,5vw,34px)/1 var(--display);margin:6px 0 4px;text-transform:uppercase}
.sub{color:var(--muted);margin:0;font-size:14px}
.bar{position:sticky;top:0;z-index:5;background:#fff;border-bottom:1px solid var(--line);padding-block:10px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.stat{border:1px solid var(--line);border-radius:8px;padding:6px 8px;text-align:center;cursor:pointer;background:#fff;font:inherit;color:inherit}
.stat b{display:block;font:700 22px/1.1 var(--mono)}
.stat span{font-size:12px;color:var(--muted)}
.stat[aria-pressed="true"]{border-color:var(--green);box-shadow:inset 0 0 0 2px var(--green)}
.stat.ok b{color:var(--green)} .stat.ns b{color:var(--red)} .stat.pe b{color:var(--amber)}
main{padding-block:12px 40px}
.day{margin:18px 0 8px;font:700 20px/1 var(--display);text-transform:uppercase;color:var(--green-dark);letter-spacing:.03em}
.flight{border:1px solid var(--line);border-left:5px solid var(--green);border-radius:10px;margin-bottom:10px;overflow:hidden}
.fh{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 14px;padding:10px 12px;background:var(--green-soft)}
.fh .t{font:700 22px/1 var(--mono);color:var(--green)}
.fh .v{font:700 18px/1.1 var(--display);letter-spacing:.03em}
.fh .r{font-size:14px;color:var(--muted)}
.fh .c{margin-left:auto;font:600 13px/1 var(--body);color:var(--green-dark)}
.pax{display:flex;align-items:center;gap:10px;padding:9px 12px;border-top:1px solid var(--line)}
.pax.st-ok{background:#F2F9F4} .pax.st-ns{background:var(--red-soft)}
.who{flex:1;min-width:0}
.who b{display:block;font-size:15px}
.who small{color:var(--muted);font-size:13px}
.tag{display:inline-block;margin-left:6px;font:600 11px/1 var(--body);padding:3px 6px;border-radius:999px;background:var(--amber-soft);color:var(--amber);vertical-align:2px}
.btns{display:flex;gap:6px;flex-shrink:0}
.btns button{font:600 13px/1 var(--body);border-radius:8px;padding:9px 10px;cursor:pointer;border:1px solid var(--line);background:#fff;color:var(--ink);min-width:74px}
.btns .bok[aria-pressed="true"]{background:var(--green);border-color:var(--green);color:#fff}
.btns .bns[aria-pressed="true"]{background:var(--red);border-color:var(--red);color:#fff}
.tools{display:flex;flex-wrap:wrap;gap:8px;margin-top:20px}
.tools button{font:600 14px/1 var(--body);border-radius:8px;padding:11px 14px;cursor:pointer;border:1px solid var(--green);background:var(--green);color:#fff}
.tools .sec{background:#fff;color:var(--green)}
.note{color:var(--muted);font-size:13px;margin-top:10px}
#msg{color:var(--green-dark);font-weight:600;min-height:1.2em;margin-top:8px}
#gate{position:fixed;inset:0;z-index:999;background:#fff;display:flex;align-items:center;justify-content:center;padding:20px}
.gate-box{width:100%;max-width:380px;border:1px solid var(--line);border-top:4px solid var(--green);border-radius:12px;padding:22px 20px}
.gate-box img{display:block;width:min(240px,70%);height:auto;margin-bottom:14px}
.gate-box h2{margin:6px 0 16px;font:700 26px/1 var(--display);text-transform:uppercase;color:var(--green)}
.gate-box label{display:block;font-weight:600;margin-bottom:6px}
.gate-box input{width:100%;font:500 18px/1.2 var(--mono);padding:12px;border:1px solid var(--green-line);border-radius:8px}
.gate-box button{width:100%;margin-top:12px;background:var(--green);color:#fff;border:0;border-radius:8px;padding:13px;font:600 16px/1 var(--body);cursor:pointer}
#gate-msg{min-height:1.4em;margin:10px 0 0;color:var(--red);font-size:14px}
@media (max-width:480px){.btns button{min-width:0;padding:9px 8px}.pax{gap:8px}}
@media print{#gate,.bar .stats,.tools,.note{display:none}.btns{display:none}.pax.st-ok .who b::after{content:" ✓ llegó"}.pax.st-ns .who b::after{content:" ✗ no show"}}
</style>
</head>
<body>
<div id="gate" hidden>
  <form id="gate-form" class="gate-box" autocomplete="off">
    <img src="logo-eci.png" alt="Viajes El Corte Inglés" width="900" height="126">
    <p class="eyebrow">Control de llegadas</p>
    <h2>Evento CC IP Foráneo</h2>
    <label for="gate-pin">Escribe el PIN de acceso</label>
    <input id="gate-pin" type="password" autocapitalize="off" autocorrect="off" spellcheck="false">
    <button type="submit">Entrar</button>
    <p id="gate-msg" role="alert"></p>
  </form>
</div>
<header><div class="wrap">
  <img class="logo" src="logo-eci.png" alt="Viajes El Corte Inglés" width="900" height="126">
  <div class="eyebrow">Evento CC IP Foráneo · Uso interno</div>
  <h1>Control de llegadas</h1>
  <p class="sub">Llegadas a Tijuana en orden de fecha y hora. <span id="upd"></span></p>
</div></header>
<div class="bar"><div class="wrap">
  <div class="stats" role="group" aria-label="Filtrar">
    <button class="stat" data-f="all" aria-pressed="true"><b id="s-all">0</b><span>Total</span></button>
    <button class="stat ok" data-f="ok" aria-pressed="false"><b id="s-ok">0</b><span>Llegaron</span></button>
    <button class="stat ns" data-f="ns" aria-pressed="false"><b id="s-ns">0</b><span>No show</span></button>
    <button class="stat pe" data-f="pe" aria-pressed="false"><b id="s-pe">0</b><span>Pendientes</span></button>
  </div>
</div></div>
<main class="wrap">
  <div id="out"></div>
  <div class="tools">
    <button id="copy">Copiar resumen para WhatsApp</button>
    <button id="print" class="sec">Imprimir</button>
    <button id="reset" class="sec">Borrar marcas</button>
  </div>
  <p id="msg" role="status"></p>
  <p class="note">Las marcas de "Llegó" y "No show" se guardan solo en este dispositivo. Para compartirlas con el equipo usa "Copiar resumen".</p>
</main>
<script src="cifra.js"></script>
<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const tcase = s => String(s||'').toLowerCase().replace(/(^|\s)\S/g, c => c.toUpperCase());
const DIA = ['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'], MES = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
const fdate = f => { const [y,m,d] = f.split('-').map(Number); const x = new Date(Date.UTC(y,m-1,d)); return `${DIA[x.getUTCDay()]} ${d} ${MES[m-1]}`; };
const hh = t => String(t||'').padStart(5,'0');
const KEY = 'ctl-cc26';
let DATA = [], MARKS = {}, FILTER = 'all';
try{ MARKS = JSON.parse(localStorage.getItem(KEY) || '{}') || {}; }catch(e){ MARKS = {}; }
const save = () => { try{ localStorage.setItem(KEY, JSON.stringify(MARKS)); }catch(e){} };
const st = n => MARKS[n] || 'pe';

function groups(){
  const g = {};
  DATA.forEach(r => { const l = r.ida; if(!l) return;
    const k = l.f + '|' + hh(l.l) + '|' + l.v; (g[k] = g[k] || {l, pax: []}).pax.push(r); });
  return Object.keys(g).sort().map(k => { g[k].pax.sort((a,b) => a.n.localeCompare(b.n,'es')); return g[k]; });
}
function render(){
  const all = DATA.filter(r => r.ida), c = {ok:0, ns:0, pe:0};
  all.forEach(r => c[st(r.n)]++);
  $('#s-all').textContent = all.length; $('#s-ok').textContent = c.ok; $('#s-ns').textContent = c.ns; $('#s-pe').textContent = c.pe;
  let html = '', lastDay = '';
  groups().forEach(G => {
    const pax = G.pax.filter(r => FILTER === 'all' || st(r.n) === FILTER); if(!pax.length) return;
    const l = G.l, ok = G.pax.filter(r => st(r.n) === 'ok').length;
    if(l.f !== lastDay){ html += `<h2 class="day">${fdate(l.f)}</h2>`; lastDay = l.f; }
    html += `<section class="flight"><div class="fh"><span class="t">${esc(hh(l.l))}</span><span class="v">${esc(l.v)}</span>
      <span class="r">${esc(l.o)} ${esc(hh(l.s))} → TIJ ${esc(hh(l.l))}</span><span class="c">${ok}/${G.pax.length} llegaron</span></div>` +
      pax.map(r => { const s = st(r.n), con = r.c1 ? ` · conexión ${esc(r.c1.v)} desde ${esc(r.c1.o)}` : '';
        const pern = (r.notas||[]).some(n => n.k === 'pe') ? '<span class="tag">Pernocta TIJ</span>' : '';
        return `<div class="pax st-${s}"><div class="who"><b>${esc(r.n)}${pern}</b><small>${esc(tcase(r.rg))} · Clave ${esc(r.ci || r.cr || '—')}${con}</small></div>
          <div class="btns"><button class="bok" data-n="${esc(r.n)}" data-s="ok" aria-pressed="${s==='ok'}">✓ Llegó</button>
          <button class="bns" data-n="${esc(r.n)}" data-s="ns" aria-pressed="${s==='ns'}">✗ No show</button></div></div>`; }).join('') + '</section>';
  });
  $('#out').innerHTML = html || '<p class="note">No hay invitados en este filtro.</p>';
}
$('#out').addEventListener('click', e => { const b = e.target.closest('button[data-n]'); if(!b) return;
  const n = b.dataset.n, s = b.dataset.s; if(MARKS[n] === s) delete MARKS[n]; else MARKS[n] = s; save(); render(); });
document.querySelectorAll('.stat').forEach(b => b.addEventListener('click', () => {
  FILTER = b.dataset.f; document.querySelectorAll('.stat').forEach(x => x.setAttribute('aria-pressed', x === b)); render(); }));
function resumen(){
  const L = ['*Control de llegadas · CC26*', ''];
  const all = DATA.filter(r => r.ida), c = {ok:0, ns:0, pe:0}; all.forEach(r => c[st(r.n)]++);
  L.push(`Total ${all.length} · Llegaron ${c.ok} · No show ${c.ns} · Pendientes ${c.pe}`);
  let lastDay = '';
  groups().forEach(G => { const l = G.l;
    if(l.f !== lastDay){ L.push('', '*' + fdate(l.f) + '*'); lastDay = l.f; }
    L.push(`${hh(l.l)} ${l.v} (${l.o})`);
    G.pax.forEach(r => { const s = st(r.n); L.push(`  ${s==='ok'?'✅':s==='ns'?'❌':'⏳'} ${tcase(r.n)}`); }); });
  return L.join('\n');
}
$('#copy').addEventListener('click', async () => { const t = resumen();
  try{ await navigator.clipboard.writeText(t); $('#msg').textContent = 'Resumen copiado. Pégalo en WhatsApp.'; }
  catch(e){ const a = document.createElement('textarea'); a.value = t; document.body.appendChild(a); a.select(); document.execCommand('copy'); a.remove(); $('#msg').textContent = 'Resumen copiado.'; } });
$('#print').addEventListener('click', () => window.print());
$('#reset').addEventListener('click', () => { if(confirm('¿Borrar todas las marcas de este dispositivo?')){ MARKS = {}; save(); render(); $('#msg').textContent = 'Marcas borradas.'; } });

let PACK = null; const gate = $('#gate'), gin = $('#gate-pin'), gmsg = $('#gate-msg');
function showGate(m){ gate.hidden = false; gmsg.textContent = m || ''; gin.value = ''; setTimeout(() => gin.focus(), 50); }
$('#gate-form').addEventListener('submit', async e => { e.preventDefault(); const v = gin.value.trim();
  if(!v){ gmsg.textContent = 'Escribe el PIN.'; return; } if(!PACK){ gmsg.textContent = 'Cargando…'; return; }
  gmsg.textContent = 'Verificando…';
  try{ const d = await Cifra.descifrar(PACK.enc, v); DATA = d.filas; gate.hidden = true; $('#upd').textContent = 'Datos del ' + PACK.actualizado + '.'; render(); }
  catch(err){ showGate('PIN incorrecto. Revísalo e intenta de nuevo.'); } });
fetch('data.json?v=' + Date.now()).then(r => r.json()).then(j => {
  if(j.enc){ PACK = j; showGate(''); } else { DATA = j.filas || []; $('#upd').textContent = 'Datos del ' + j.actualizado + '.'; render(); } })
  .catch(() => { $('#out').innerHTML = '<p class="note">No se pudo cargar la información. Recarga la página.</p>'; });
</script>
</body>
</html>
