<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Manifiesto de Salidas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
:root{
  color-scheme:light;
  --green:#126B30;--green-dark:#0C4F23;--green-soft:#E6F2EA;
  --bg:#FFFFFF;--surface:#FFFFFF;--ink:#16301F;--muted:#55705E;--line:#D3E4D8;
  --board:var(--green);--board-ink:#FFFFFF;--board-muted:#CFE6D6;--amber:#CDE8D4;--amber-ink:#0C4F23;
  --chip:var(--green-soft);--accent:var(--green);--ok:var(--green);--ok-bg:var(--green-soft);--warn:#55705E;--warn-bg:#EEF2EF;
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 var(--body)}
.wrap{max-width:1080px;margin:0 auto;padding-inline:16px}
header.board{padding-block:20px 18px;border-bottom:4px solid var(--green)}
.logo{display:block;width:min(300px,78vw);height:auto;margin-bottom:14px}
.eyebrow{font:600 12px/1 var(--body);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
h1{color:var(--green);font:700 clamp(30px,6vw,46px)/1 var(--display);letter-spacing:.01em;margin:8px 0 4px;text-transform:uppercase;text-wrap:balance}
.sub{color:var(--muted);margin:0;font-size:15px}
.sub b{color:var(--ink)}
.stats{display:flex;flex-wrap:wrap;gap:8px 22px;margin-top:14px;font-size:14px;color:var(--muted)}
.stats b{font:700 20px/1 var(--mono);color:var(--green);margin-right:6px}
#upd{font-size:13px;margin-top:8px}

.controls{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:14px 10px;border-bottom:1px solid var(--line)}
.search{position:relative}
.search input{width:100%;font:500 18px var(--body);padding:14px 44px 14px 46px;border-radius:10px;border:2px solid var(--line);background:var(--surface);color:var(--ink)}
.search input:focus{outline:none;border-color:var(--accent)}
input[type=search]::-webkit-search-cancel-button{display:none}
.search svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--muted)}
.clear{position:absolute;right:8px;top:50%;transform:translateY(-50%);border:0;background:var(--chip);color:var(--ink);width:30px;height:30px;border-radius:50%;cursor:pointer;font-size:16px}
.row{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;align-items:center}
.seg{display:inline-flex;background:var(--chip);border-radius:8px;padding:3px}
.seg button{border:0;background:transparent;color:var(--muted);font:600 14px var(--body);padding:7px 12px;border-radius:6px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
select{flex:1 1 150px;font:500 14px var(--body);padding:8px 10px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);max-width:100%}
button:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.count{margin-left:auto;font-size:14px;color:var(--muted)}
.count b{color:var(--ink);font-family:var(--mono)}

main{padding-block:16px 48px}
.list{display:grid;gap:14px}
.tbar{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:8px}
.tbar button{font:600 14px var(--body);border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:8px 12px;cursor:pointer}
.dayh{font:700 22px/1 var(--display);text-transform:uppercase;letter-spacing:.03em;color:var(--green-dark);margin:10px 0 0;padding-bottom:6px;border-bottom:2px solid var(--line)}

.pu{background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden;break-inside:avoid}
.puh{background:var(--board);color:var(--board-ink);display:flex;flex-wrap:wrap;align-items:center;gap:6px 18px;padding:12px 16px}
.putime span{display:block;font:600 10.5px var(--body);letter-spacing:.12em;text-transform:uppercase;color:var(--board-muted)}
.putime b{font:700 30px/1 var(--mono)}
.pudate{font:500 15px var(--body);color:var(--board-muted)}
.pucount{margin-left:auto;background:var(--amber);color:var(--amber-ink);border-radius:8px;padding:6px 10px;font:700 12px var(--body);letter-spacing:.08em;text-transform:uppercase}
.pucount b{font:700 20px/1 var(--mono);margin-right:4px}
.fls{display:flex;flex-wrap:wrap;gap:6px;padding:10px 16px 0}
.flc{font:600 13px var(--body);background:var(--chip);border-radius:6px;padding:4px 8px}
.flc b{font-family:var(--mono)}
table.pl{border-collapse:collapse;width:100%;font-size:15px;font-variant-numeric:tabular-nums}
.pl th{font:600 11px var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);text-align:left;padding:10px 16px 6px}
.pl td{padding:7px 16px;border-top:1px dashed var(--line)}
.pl td.n{width:36px;color:var(--muted);font-family:var(--mono);font-size:13px}
.pl td.m{font-family:var(--mono);white-space:nowrap}
.pl .dim{color:var(--muted);font-size:13px}
.st{font:600 11px var(--body);border-radius:99px;padding:3px 8px;text-transform:uppercase;white-space:nowrap}
.st.ok{background:var(--ok-bg);color:var(--ok)} .st.pend{background:var(--warn-bg);color:var(--warn)}

.tablewrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:10px}
table.rep{border-collapse:collapse;width:100%;font-size:14px;font-variant-numeric:tabular-nums;white-space:nowrap}
.rep th{position:sticky;top:0;background:var(--board);color:var(--board-ink);font:600 11px var(--body);letter-spacing:.08em;text-transform:uppercase;text-align:left;padding:9px 10px}
.rep td{padding:8px 10px;border-top:1px solid var(--line)}
.rep tbody tr:nth-child(even) td{background:color-mix(in srgb,var(--chip) 45%,transparent)}
.rep td.m{font-family:var(--mono)}
.rep td.pk{font:700 14px var(--mono);color:var(--green-dark)}
.nof{background:var(--warn-bg);border-radius:10px;padding:12px 16px;font-size:14px;color:var(--warn)}
.nof b{color:var(--ink)}
mark{background:var(--amber);color:var(--amber-ink);border-radius:2px;padding:0 1px}
.empty{text-align:center;color:var(--muted);padding:48px 16px}
.foot{font-size:13px;color:var(--muted);margin-top:28px}
@media (max-width:640px){
  .count{margin-left:0;width:100%}
  .pucount{margin-left:0}
  .pl .hide-s{display:none}
}
@media print{
  .controls,.tbar,.foot{display:none}
  header.board{padding-block:0 8px}
  .logo{width:200px;margin-bottom:6px}
  .stats{display:none}
  main{padding-block:8px 0}
  body{font-size:12px}
  .puh,.rep th{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .pu{margin-bottom:10px}
  .pl td{padding:4px 12px}
  .tablewrap{overflow:visible;border:0}
  table.rep{font-size:10px;white-space:normal}
}
</style>
</head>
<body>
<header class="board">
  <div class="wrap">
    <img class="logo" src="logo.png" alt="Viajes El Corte Inglés Grupos" width="469" height="131">
    <div class="eyebrow" id="ev">Evento</div>
    <h1>Manifiesto de salidas</h1>
    <p class="sub">Pick up al aeropuerto <b id="hrslabel">3 horas antes</b> de la salida del vuelo de regreso, agrupado por horario.</p>
    <div class="stats" id="stats"></div>
    <div class="sub" id="upd"></div>
  </div>
</header>

<div class="controls">
  <div class="wrap">
    <div class="search">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="search" placeholder="Buscar por nombre…" autocomplete="off" aria-label="Buscar por nombre">
      <button class="clear" id="clear" aria-label="Borrar búsqueda" hidden>×</button>
    </div>
    <div class="row">
      <div class="seg" role="group" aria-label="Estatus" id="stf">
        <button data-st="" aria-pressed="true">Todos</button>
        <button data-st="CONF" aria-pressed="false">Confirmados</button>
        <button data-st="PEND" aria-pressed="false">Pendientes</button>
      </div>
      <select id="fday" aria-label="Día de pick up"></select>
      <select id="freg" aria-label="Vuelo de regreso"></select>
      <div class="seg" role="group" aria-label="Vista">
        <button data-view="pu" aria-pressed="true">Por pick up</button>
        <button data-view="table" aria-pressed="false">Tabla</button>
      </div>
      <div class="count" id="count"></div>
    </div>
  </div>
</div>

<main class="wrap">
  <div id="out" class="list"><div class="empty">Cargando…</div></div>
  <p class="foot">Horarios en hora local del aeropuerto de salida. Pick up = hora de salida del vuelo de regreso menos 3 horas.</p>
</main>

<script>
// Horas de anticipación del pick up respecto a la salida del vuelo de regreso.
const HORAS_ANTES = 3;

let DATA = [];
const $ = s => document.querySelector(s);
const pad = n => String(n).padStart(2,'0');
const norm = s => (s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toUpperCase();
const esc = s => String(s??'').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const MES = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
const DIA = ['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'];
const DIAL = ['Domingo','Lunes','Martes','Miércoles','Jueves','Viernes','Sábado'];
function fmtDate(s, long){ const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(s||''); if(!m) return s||''; const d=new Date(Date.UTC(+m[1],m[2]-1,+m[3])); return `${(long?DIAL:DIA)[d.getUTCDay()]} ${+m[3]} ${MES[m[2]-1]}`; }
const confirmed = r => /CONFIRM/.test(r.st);
const state = {q:'', st:'', day:'', reg:'', view:'pu'};

// Pick up: fecha y hora de salida del vuelo de regreso menos HORAS_ANTES (cruza la medianoche si hace falta).
function pickup(l){
  if(!l) return null;
  const d=/^(\d{4})-(\d{2})-(\d{2})$/.exec(l.f||''), t=/^(\d{1,2}):(\d{2})$/.exec(l.s||'');
  if(!d || !t) return null;
  const x = new Date(Date.UTC(+d[1], d[2]-1, +d[3], +t[1], +t[2]) - HORAS_ANTES*36e5);
  return { f:`${x.getUTCFullYear()}-${pad(x.getUTCMonth()+1)}-${pad(x.getUTCDate())}`, h:`${pad(x.getUTCHours())}:${pad(x.getUTCMinutes())}` };
}
const finalDest = r => (r.c2 && r.c2.d) || (r.reg && r.reg.d) || '';

function hl(text){
  text = String(text??''); if(!state.q) return esc(text);
  const terms = norm(state.q).split(/\s+/).filter(Boolean), n = norm(text), mk = new Array(text.length).fill(false);
  terms.forEach(t=>{let i=0;while((i=n.indexOf(t,i))>-1){for(let j=i;j<i+t.length;j++)mk[j]=true;i+=t.length;}});
  let o='',op=false; for(let i=0;i<text.length;i++){ if(mk[i]&&!op){o+='<mark>';op=true} if(!mk[i]&&op){o+='</mark>';op=false} o+=esc(text[i]); }
  return o+(op?'</mark>':'');
}
const stPill = r => `<span class="st ${confirmed(r)?'ok':'pend'}">${confirmed(r)?'Confirmado':'Pendiente'}</span>`;

function groups(rows){
  const g = new Map();
  rows.filter(r=>r._pu).forEach(r=>{ const k=r._pu.f+' '+r._pu.h; if(!g.has(k)) g.set(k,{pu:r._pu,list:[]}); g.get(k).list.push(r); });
  return [...g.values()].sort((a,b)=>(a.pu.f+a.pu.h).localeCompare(b.pu.f+b.pu.h));
}
function puView(rows){
  const gs = groups(rows); let html = `<div class="tbar"><button id="print">Imprimir manifiesto</button><button id="copytable">Copiar tabla para Excel</button></div>`;
  let day='';
  gs.forEach(({pu,list})=>{
    if(pu.f!==day){ day=pu.f; html+=`<h2 class="dayh">${fmtDate(pu.f,true)}</h2>`; }
    const fl = new Map(); list.forEach(r=>{ const l=r.reg; if(!fl.has(l.v)) fl.set(l.v,{l,n:0}); fl.get(l.v).n++; });
    html += `<section class="pu">
      <div class="puh"><div class="putime"><span>Pick up</span><b>${pu.h}</b></div>
        <div class="pudate">${fmtDate(pu.f)}</div>
        <div class="pucount"><b>${list.length}</b>pax</div></div>
      <div class="fls">${[...fl.values()].map(({l,n})=>`<span class="flc">Vuelo <b>${esc(l.v)}</b> · ${esc(l.o)}→${esc(l.d)} · sale <b>${esc(l.s)}</b> · ${n} pax</span>`).join('')}</div>
      <table class="pl"><thead><tr><th>#</th><th>Nombre</th><th>Vuelo</th><th>Sale</th><th>Destino</th><th class="hide-s">Estatus</th></tr></thead><tbody>
      ${list.map((r,i)=>`<tr><td class="n">${i+1}</td><td>${hl(r.n)}${r.rg?`<div class="dim">${esc(r.rg)}</div>`:''}</td>
        <td class="m">${esc(r.reg.v)}${r.c2?`<div class="dim">+ ${esc(r.c2.v)}</div>`:''}</td><td class="m">${esc(r.reg.s)}</td>
        <td>${esc(finalDest(r))}${r.c2?`<div class="dim">vía ${esc(r.reg.d)}</div>`:''}</td><td class="hide-s">${stPill(r)}</td></tr>`).join('')}
      </tbody></table></section>`;
  });
  const sin = rows.filter(r=>!r._pu);
  if(sin.length) html += `<div class="nof"><b>${sin.length} sin vuelo de regreso</b> (no entran al manifiesto): ${sin.map(r=>hl(r.n)).join(', ')}</div>`;
  if(!gs.length && !sin.length) html += `<div class="empty">Sin resultados.</div>`;
  return html;
}
const TCOLS = ['Fecha pick up','Hora pick up','Nombre','Estatus','Región','Vuelo regreso','Fecha vuelo','Sale','Origen','Destino','Conexión','Destino final'];
function tRows(rows){
  return rows.filter(r=>r._pu).sort((a,b)=>(a._pu.f+a._pu.h).localeCompare(b._pu.f+b._pu.h) || a.n.localeCompare(b.n,'es'))
    .map(r=>[r._pu.f, r._pu.h, r.n, confirmed(r)?'Confirmado':'Pendiente', r.rg||'', r.reg.v, r.reg.f, r.reg.s, r.reg.o, r.reg.d, r.c2?r.c2.v:'', finalDest(r)]);
}
function tableView(rows){
  const body = tRows(rows).map((a,i)=>`<tr><td>${i+1}</td><td>${fmtDate(a[0])}</td><td class="pk">${a[1]}</td><td>${hl(a[2])}</td>
    <td><span class="st ${a[3]==='Confirmado'?'ok':'pend'}">${a[3]}</span></td><td>${esc(a[4])}</td><td class="m">${esc(a[5])}</td>
    <td>${fmtDate(a[6])}</td><td class="m">${a[7]}</td><td>${esc(a[8])}</td><td>${esc(a[9])}</td><td class="m">${esc(a[10])||'—'}</td><td>${esc(a[11])}</td></tr>`).join('');
  const sin = rows.filter(r=>!r._pu);
  return `<div class="tbar"><button id="print">Imprimir</button><button id="copytable">Copiar tabla para Excel</button></div>
    <div class="tablewrap"><table class="rep"><thead><tr><th>#</th>${TCOLS.map(c=>`<th>${c}</th>`).join('')}</tr></thead><tbody>${body}</tbody></table></div>
    ${sin.length?`<div class="nof"><b>${sin.length} sin vuelo de regreso:</b> ${sin.map(r=>hl(r.n)).join(', ')}</div>`:''}`;
}
const tableTSV = rows => [TCOLS].concat(tRows(rows)).map(a=>a.join('\t')).join('\n');

function filtered(){
  const terms = norm(state.q).split(/\s+/).filter(Boolean);
  return DATA.filter(r =>
    (!state.st || (state.st==='CONF') === confirmed(r)) &&
    (!state.day || (r._pu && r._pu.f===state.day)) &&
    (!state.reg || (r.reg&&r.reg.v===state.reg)) &&
    (!terms.length || terms.every(t=>r._w.some(w=>w.startsWith(t)))));
}
function render(){
  const rows = filtered(), n = rows.filter(r=>r._pu).length;
  $('#count').innerHTML = `<b>${n}</b> pax en manifiesto`;
  $('#clear').hidden = !state.q;
  if(!rows.length){ $('#out').innerHTML = `<div class="empty">No hay coincidencias${state.q?` con “${esc(state.q)}”`:''}. Revisa la ortografía o quita un filtro.</div>`; return; }
  $('#out').innerHTML = state.view==='table' ? tableView(rows) : puView(rows);
}
function init(){
  DATA.forEach(r => { r._w = norm(r.n).split(/\s+/).filter(Boolean); r._pu = pickup(r.reg); });
  const days = [...new Set(DATA.filter(r=>r._pu).map(r=>r._pu.f))].sort();
  $('#fday').innerHTML = `<option value="">Todos los días</option>` + days.map(d=>`<option value="${d}">Pick up ${fmtDate(d)}</option>`).join('');
  const fl = new Map(); DATA.forEach(r=>{ if(r.reg && !fl.has(r.reg.v)) fl.set(r.reg.v, r.reg); });
  $('#freg').innerHTML = `<option value="">Todos los vuelos de regreso</option>` + [...fl.values()].sort((a,b)=>(a.f+a.s).localeCompare(b.f+b.s))
    .map(l=>`<option value="${esc(l.v)}">${esc(l.v)} · ${esc(l.o)}→${esc(l.d)} · ${fmtDate(l.f)} ${esc(l.s)}</option>`).join('');
  const withPu = DATA.filter(r=>r._pu), slots = new Set(withPu.map(r=>r._pu.f+r._pu.h));
  $('#stats').innerHTML = `<div><b>${withPu.length}</b>pax con regreso</div><div><b>${slots.size}</b>horarios de pick up</div><div><b>${days.length}</b>día${days.length===1?'':'s'}</div><div><b>${DATA.length-withPu.length}</b>sin vuelo de regreso</div>`;
  $('#hrslabel').textContent = `${HORAS_ANTES} hora${HORAS_ANTES===1?'':'s'} antes`;
  render();
}
let t;
$('#q').addEventListener('input', e=>{clearTimeout(t); t=setTimeout(()=>{state.q=e.target.value.trim(); render();},150)});
$('#clear').addEventListener('click', ()=>{$('#q').value=''; state.q=''; render(); $('#q').focus()});
$('#stf').addEventListener('click', e=>{const b=e.target.closest('button'); if(!b) return; state.st=b.dataset.st;
  $('#stf').querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',x===b)); render()});
$('#fday').addEventListener('change', e=>{state.day=e.target.value; render()});
$('#freg').addEventListener('change', e=>{state.reg=e.target.value; render()});
document.querySelectorAll('[data-view]').forEach(b=>b.addEventListener('click',()=>{ state.view=b.dataset.view;
  document.querySelectorAll('[data-view]').forEach(x=>x.setAttribute('aria-pressed',x===b)); render()}));
$('#out').addEventListener('click', e=>{
  if(e.target.id==='print'){ window.print(); return; }
  if(e.target.id==='copytable'){ const b=e.target; Promise.resolve().then(()=>navigator.clipboard.writeText(tableTSV(filtered())))
    .then(()=>{b.textContent='Tabla copiada: pégala en Excel'; setTimeout(()=>b.textContent='Copiar tabla para Excel',2500)})
    .catch(()=>{ b.textContent='No se pudo copiar'; }); }
});
fetch('data.json?v='+Date.now()).then(r=>r.json()).then(j=>{
  DATA=j.filas||[]; if(j.evento) $('#ev').textContent=j.evento; $('#upd').textContent='Actualizado: '+j.actualizado; init(); })
  .catch(()=>{ $('#out').innerHTML='<div class="empty">No se pudo cargar la información. Recarga la página.</div>'; });
</script>
</body>
</html>
