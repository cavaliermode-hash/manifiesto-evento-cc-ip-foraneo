<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Manifiesto Evento CC IP Foráneo</title>
<style>
:root{--green:#126B30;--ink:#16301F;--muted:#55705E;--soft:#E6F2EA}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:#fff;color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;display:flex;flex-direction:column}
header{padding:18px 16px 14px;border-bottom:4px solid var(--green)}
.logos{max-width:900px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:16px}
.logos img{display:block;height:auto}
.eci{width:min(280px,50vw)}.ml{width:min(180px,34vw)}
main{flex:1;display:grid;place-items:center;padding:32px 16px}
.box{max-width:520px;text-align:center;background:var(--soft);border:1px solid #B9D9C3;border-radius:14px;padding:28px 22px}
.ic{font-size:40px;line-height:1}
h1{margin:12px 0 6px;font-size:24px;color:var(--green);text-transform:uppercase;letter-spacing:.03em}
p{margin:0;color:var(--muted)}
</style>
</head>
<body>
<header><div class="logos"><img class="eci" src="logo-eci.png" alt="Viajes El Corte Inglés" width="900" height="126"><img class="ml" src="logo-metlife-v2.png" alt="MetLife" width="900" height="175"></div></header>
<main><div class="box"><div class="ic" aria-hidden="true">🔒</div><h1>Página no disponible por el momento</h1><p>La consulta de vuelos está temporalmente cerrada. Vuelve a intentarlo más tarde o contacta a tu coordinador de Viajes El Corte Inglés.</p></div></main>
</body>
</html>
